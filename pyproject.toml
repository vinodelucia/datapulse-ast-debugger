[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse-ast-debugger"
version = "1.1.0"
description = "Read-Only Multi-Language AST Static Debugger for Data Engineering & Backend (Python, SQL, R, JavaScript/TypeScript) with ChromaDB RAG Memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:tree_sitter.*",
]
